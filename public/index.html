<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReviewHub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/styles_premium.css" />
  </head>
  <body>
    <!-- App layout wraps the entire 3 columns -->
    <div class="app-3col-layout">

      <!-- ========================================= -->
      <!-- COLUMN 1: LEFT SIDEBAR (Nav & Context)      -->
      <!-- ========================================= -->
      <aside class="app-sidebar">
        <header class="sidebar-header">
          <div>
            <p class="eyebrow">本地处理台</p>
            <h1>ReviewHub</h1>
          </div>
          <button id="refreshButton" class="button button-sm" type="button">刷新</button>
        </header>

        <nav class="sidebar-nav-card card">
          <div class="panel-heading"><h2>工作区</h2></div>
          <div id="workspaceHighlights" class="sidebar-highlights sidebar-stack"></div>
        </nav>

        
      </aside>

      <!-- ========================================= -->
      <!-- COLUMN 2: MIDDLE FEED (The Main List)       -->
      <!-- ========================================= -->
      <main class="app-feed">
        <section id="statusBanner" class="status-banner">正在加载数据…</section>
        <section id="flashBanner" class="flash-banner" hidden></section>

        <!-- Queue Section -->
        <section id="queuePanel" class="workspace-panel feed-panel" data-section-panel="queue">
          <!-- Compact toolbar: just tabs + search -->          
          <div class="queue-toolbar">
            <div class="queue-toolbar-row">
              <div class="inbox-view-row" role="tablist" aria-label="收件箱状态">
                <button class="button inbox-view-tab is-active" data-inbox-tab="pending" type="button">待审核</button>
                <button class="button inbox-view-tab" data-inbox-tab="ready" type="button">可以继续</button>
                <button class="button inbox-view-tab" data-inbox-tab="missing_info" type="button">资料不全</button>
                <button class="button inbox-view-tab" data-inbox-tab="deferred" type="button">已暂缓</button>
                <button class="button inbox-view-tab" data-inbox-tab="all" type="button">全部</button>
              </div>
              <div class="queue-toolbar-actions">
                <div id="resultCount" class="panel-meta"></div>
                <button id="filterResetButton" class="button button-sm" type="button">重置</button>
              </div>
            </div>
            <div class="queue-toolbar-search">
              <input id="searchInput" type="search" placeholder="搜索标题 / 备注 / 来源..." />
              <details class="filter-details">
                <summary class="tag tag-muted" style="cursor: pointer; display: inline-flex; font-size: 10px;">筛选</summary>
                <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                  <label class="filters-column"><span style="font-size: 11px; color: #64748b;">项目</span><select id="projectFilter"></select></label>
                  <label class="filters-column"><span style="font-size: 11px; color: #64748b;">状态</span><select id="statusFilter"></select></label>
                  <label class="filters-column"><span style="font-size: 11px; color: #64748b;">处理状态</span><select id="actionStateFilter"></select></label>
                  <label class="filters-column"><span style="font-size: 11px; color: #64748b;">平台</span><select id="platformFilter"></select></label>
                  <label class="filters-column"><span style="font-size: 11px; color: #64748b;">风险</span><select id="riskFilter"></select></label>
                </div>
              </details>
            </div>
            <!-- Hidden: keeps JS summary rendering working -->
            <div id="summaryCards" hidden></div>
          </div>
          <div id="listMeta" style="display:none;"></div>
          <div id="itemList" class="item-list"></div>
          
        </section>

        <!-- Overview Section -->
        <section data-section-panel="overview" class="feed-section" hidden>
           <div class="list-header">
            <p class="section-kicker">概览</p>
            <h2>处理概览池</h2>
          </div>
          <section class="management-grid" aria-label="管理分桶">
            <section class="card bucket-card"><div class="panel-heading"><h2>等你决定</h2><div id="needsReviewCount" class="panel-meta"></div></div><div id="needsReviewList" class="bucket-list"></div></section>
            <section class="card bucket-card"><div class="panel-heading"><h2>可以继续</h2><div id="readyToExecuteCount" class="panel-meta"></div></div><div id="readyToExecuteList" class="bucket-list"></div></section>
            <section class="card bucket-card"><div class="panel-heading"><h2>资料不全</h2><div id="needsInfoCount" class="panel-meta"></div></div><div id="needsInfoList" class="bucket-list"></div></section>
            <section class="card bucket-card"><div class="panel-heading"><h2>已暂缓</h2><div id="deferredCount" class="panel-meta"></div></div><div id="deferredList" class="bucket-list"></div></section>
          </section>
        </section>

        <!-- Operations Section -->
        <section data-section-panel="operations" class="feed-section" hidden>
           <div class="list-header">
            <p class="section-kicker">全量异动与需复核队列</p>
            <h2>异常拦截</h2>
            <div id="operationsUnifiedMeta" class="panel-meta" style="margin-top: 8px;"></div>
          </div>
          <div id="operationsUnifiedList" class="item-list"></div>
        </section>

        <!-- Pipeline Section -->
        <section data-section-panel="pipeline" class="feed-section" hidden>
          <div class="list-header">
            <p class="section-kicker">全量自动执行记录与回复流</p>
            <h2>机器接管</h2>
            <div id="pipelineUnifiedMeta" class="panel-meta" style="margin-top: 8px;"></div>
            <div class="panel-heading-side" style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between;">
              <div class="filter-group">
                <label>
                  <span>筛选</span>
                  <select id="threadInboxFilter">
                    <option value="needs_reply">待人工判断</option><option value="ready">可直接回复</option><option value="follow_up">待跟进</option><option value="blocked">已阻塞</option><option value="done">已处理</option><option value="all">全部</option>
                  </select>
                </label>
              </div>
            </div>
          </div>
          <div id="pipelineUnifiedList" class="item-list"></div>
        </section>
      </main>

      <!-- ========================================= -->
      <!-- COLUMN 3: RIGHT HERO (Action & Detail)      -->
      <!-- ========================================= -->
      <aside class="app-inspector">
        <section class="card detail-hero-card">
          <div class="panel-heading hero-heading" style="border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 12px;">
            <div>
              <p class="section-kicker" style="color: #4f46e5; font-size: 14px;">专注模式焦点</p>
              <h2 id="detailTitle" style="font-size: 24px; margin-top: 4px;">详细信息</h2>
              <p id="detailSubtitle" style="font-size: 14px; opacity: 0.8;"></p>
            </div>
          </div>
          
          <div id="detailEmpty" class="hero-empty-state">
            <h1>就绪态</h1>
            <p>请点击中部的队列条目，或直接应用筛选开始流水线审查。</p>
          </div>

          <div id="detailView" class="hero-content-view" hidden>
            
            <!-- THE HERO ACTION PANEL - PRIMARY FOCUS -->
            <section id="detailActionPanel" class="detail-action-panel hero-actions">
              <div id="detailActionBar" class="detail-action-bar mega-action-bar"></div>
              
              <details class="advanced-action-tools">
                <summary class="tag tag-muted" style="cursor: pointer; display: inline-flex; margin-bottom: 8px; font-size: 11px;">备注 / 暂缓...</summary>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                   <label class="detail-note-field"><span>处理人</span><input id="detailActionActor" type="text" placeholder="@reviewhub" autocomplete="off" /></label>
                   <label class="detail-note-field"><span>暂缓到</span><input id="detailActionDeferUntil" type="datetime-local" /></label>
                   <label class="detail-note-field" style="grid-column: 1 / -1;"><span>处理备注</span><textarea id="detailActionNote" rows="2" placeholder="记录处理结论"></textarea></label>
                </div>
              </details>
              <div class="detail-action-heading" style="display: none;"><div id="detailActionStatus" class="detail-action-status"></div></div>
            </section>


            <!-- CONTEXT ACTIONS (for renderContextPanel) -->
            <div id="detailContextBar" class="detail-action-bar" style="margin-bottom: 4px;"></div>

            <!-- THE RESTRUCTURED READING FLOW -->
            <section id="detailContextPanel" class="context-panel" style="display: flex; flex-direction: column; gap: 20px;">
              
              <!-- 1. The Core Object (What am I reviewing / doing?) -->
              <div id="detailInsightCore" class="insight-box core-insight" style="display: none;"></div>

              <!-- 2. AI Diagnostics & Risk (Why was this flagged?) -->
              <div id="detailInsightDiagnosis" class="insight-box diagnosis-insight" style="display: none;"></div>

              <!-- 3. Boring Metadata (The audit trail) -->
              <div id="detailInsightMetadata" class="insight-box metadata-insight"></div>

              <div class="json-dump-section" style="margin-top: 16px;">
                <details>
                  <summary id="primaryJsonTitle" class="tag tag-muted" style="cursor: pointer; display: inline-flex; font-size: 11px;">原始内容</summary>
                  <pre id="queueJson"><code class="language-json"></code></pre>
                </details>

                <details>
                  <summary id="secondaryJsonTitle" class="tag tag-muted" style="cursor: pointer; display: inline-flex; font-size: 11px; margin-top: 12px;">原始审核</summary>
                  <pre id="approvalJson"><code class="language-json"></code></pre>
                </details>
              </div>
            </section>

            <details class="inspector-collapsible">
              <summary class="inspector-section-toggle">审批历史与反馈 <span id="actionLogMeta" class="panel-meta" style="font-size: 11px;"></span></summary>
              <section id="actionLogPanel" class="detail-action-panel">
                <div id="actionLogList" class="ops-list"></div>
              </section>
            </details>
            <details class="inspector-collapsible">
              <summary class="inspector-section-toggle">源上下文</summary>
              <section id="sourcePreviewPanel" class="detail-action-panel">
                <div id="sourceArtifactList" class="detail-artifact-list"></div>
                <pre id="sourcePreview" class="json-view source-preview"></pre>
              </section>
            </details>


          </div>
        </section>
      </aside>

    </div>
    <script src="/app.js"></script>
  </body>
</html>
